# Default values for opencoze.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

mysql:
  enabled: true
  port: 3306
  targetPort: 3306
  image:
    repository: mysql
    tag: 8.4.5
  rootPassword: "root"
  database: opencoze
  user: coze
  password: coze123
  persistence:
    storageClassName: ""
    size: "50Gi"
  initScripts:
    - files/mysql/schema.sql

redis:
  enabled: true
  image:
    repository: bitnamilegacy/redis
    tag: "8.0"
  aofEnabled: "no"
  port: 6379
  ioThreads: 4
  allowEmptyPassword: "yes"
  password: ""
  persistence:
    storageClassName: ""
    size: "50Gi"

# -- coze-server configuration
cozeServer:
  enabled: true
  # -- Number of replicas for the coze-server deployment
  replicaCount: 1

  image:
    repository: coze-workflow-server
    # -- Keep the mirror up to date
    pullPolicy: IfNotPresent
    tag: 'local'

  service:
    type: LoadBalancer
    ports:
      - name: http
        port: 8888
        targetPort: 8888
      - name: minio-proxy
        port: 8889
        targetPort: 8889

  env:
    LISTEN_ADDR: ":8888"
    SERVER_HOST: "localhost${LISTEN_ADDR}"
    LOG_LEVEL: "debug"
    MAX_REQUEST_BODY_SIZE: "1073741824"
    STORAGE_TYPE: "minio"
    MINIO_PROXY_ENDPOINT: ":8889"
    FILE_UPLOAD_COMPONENT_TYPE: "storage"
    VE_IMAGEX_AK: ""
    VE_IMAGEX_SK: ""
    VE_IMAGEX_SERVER_ID: ""
    VE_IMAGEX_DOMAIN: ""
    VE_IMAGEX_TEMPLATE: ""
    VE_IMAGEX_UPLOAD_HOST: "https://imagex.volcengineapi.com"

minio:
  enabled: true
  image:
    repository: minio/minio
    tag: RELEASE.2025-06-13T11-33-47Z-cpuv1
  accessKey: minioadmin
  secretKey: minioadmin123
  bucket: opencoze
  service:
    type: LoadBalancer
    port: 9000
    consolePort: 9001
  persistence:
    storageClassName: ""
    size: "50Gi"
  resources:
    limits:
      cpu: 8000m
      memory: 16Gi
    requests:
      cpu: 4000m
      memory: 8Gi

# -- coze-web configuration (nginx frontend)
cozeWeb:
  enabled: true
  replicaCount: 1
  image:
    repository: coze-workflow-web
    pullPolicy: IfNotPresent
    tag: 'local'
  service:
    type: LoadBalancer
    port: 80

images:
  busybox: busybox:latest
  curl: alpine/curl:8.12.1


# -- We will add other services like mysql, redis etc. here later

# This is to override the chart name.
nameOverride: ''
fullnameOverride: ''

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ''
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
